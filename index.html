<!DOCTYPE html>
<!-- 这段来自 Z_Tsin 和 MCSL 开发组们一拍脑袋想出来的，你说感谢还是不感谢。-->
<!-- 过于神人了（划掉） -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>原神</title>
    <style>
        /* 设置全屏样式 */
        body, html {
            height: 100%;
            margin: 0;
            overflow: hidden;
        }

        /* 设置初始背景图片 */
        body {
            position: relative;
            width: 100%;
            height: 100%;
            background-image: url('./static/images/65476ece5b703.webp'); /* 设置第一个图片的路径 */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transition: background-image 1.5s ease-in-out; /* 渐变效果 */
        }

        /* 添加媒体查询以适配小屏幕（例如手机） */
        @media (max-width: 768px) {
            body {
                background-size: contain; /* 适配小屏幕，保持图片完整显示 */
                background-attachment: scroll; /* 允许滚动以查看完整图片 */
            }
        }
    </style>
</head>
<body>
    <audio id="bgAudio" autoplay>
        <source src="./static/music/qd.mp3" type="audio/mpeg">
    </audio>
    <script>
        var audio = document.getElementById('bgAudio');
        var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
        var browserLanguage = navigator.language || navigator.userLanguage;

        // 跳转逻辑
        function redirectToUrl() {
            if (isMobile) {
                // 如果是手机，尝试跳转到APP
                window.location.href = 'yuanshengame://';
            } else {
                if (browserLanguage !== 'zh-CN') {
                    window.location.href = 'https://genshinimpact.com';
                } else {
                    window.location.href = 'https://ys.mihoyo.com/cloud/?utm_source=yuanshen_web#/'; // 直接云原神启动
                }
            }
        }

        // 延迟加载图片
        window.addEventListener('load', function() {
            setTimeout(function() {
                document.body.style.backgroundImage = "url('./static/images/65476ecdb4c2e.png')";
            }, 3000);
        });

        // 延迟跳转
        setTimeout(redirectToUrl, 15000);
    </script>
</body>
</html>
